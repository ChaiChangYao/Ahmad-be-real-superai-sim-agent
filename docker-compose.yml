version: "3.9"
services:
  api:
    build: ./apps/api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - ./sim-data:/sim-data
  web:
    build: ./apps/web
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://api:8000
    volumes:
      - ./apps/web:/app
